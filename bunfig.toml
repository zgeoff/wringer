# pnpm-style symlinked node_modules — no phantom dependencies
[install]
linker = "isolated"

# bun add saves exact versions, no ^/~ ranges
exact = true

# supply-chain guard: only install versions published >= 7 days ago
minimumReleaseAge = 604800

# first-party packages skip the gate; their third-party dependencies stay
# behind it. Renovate bumps @zgeoff packages as soon as they publish, so each
# one wringer installs needs an entry here, or bun install refuses the bump.
minimumReleaseAgeExcludes = [
  "@zgeoff/agent-hooks",
  "@zgeoff/bun-test-extended",
  "@zgeoff/chex",
  "@zgeoff/commitlint-config",
  "@zgeoff/diet",
  "@zgeoff/format-codemod",
  "@zgeoff/oxlint-config",
  "@zgeoff/std",
  "@zgeoff/testing",
]

[test]
# registers the jest-extended matchers, starts the MSW server for HTTP tests, then fails the run
# on a process or a test folder that outlived its test
preload = [
  "@zgeoff/bun-test-extended",
  "./packages/http/src/test-utils/test-preload.ts",
  "./scripts/fail-on-test-leftovers.ts",
]
