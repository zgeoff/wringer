# Rehearses the release's publish of every @wringer/* package: it builds and
# packs each package, and runs npm's publish as a dry run. A pull request runs
# it only when it changes a file a package or the publish reads; every push to
# main runs it in full.
name: npm packages

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: npm-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    uses: zgeoff/tools/.github/workflows/paths-changed.yml@sync-v33
    with:
      paths: |
        .github/workflows/npm-packages.yml
        .github/workflows/main.yml
        scripts/publish/**
        scripts/ci/**
        scripts/release/**
        .bun-version
        bun.lock
        bunfig.toml
        package.json
        tsconfig.base.json
        packages/**

  rehearse:
    name: Rehearse the npm publish
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.changed != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      # The publish job runs npm from node 24, so the rehearsal does too.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Pack each package and dry-run its publish
        env:
          PUBLISH_MODE: rehearse
        run: bun run --silent ci:publish-packages
